# Runs Datadog Synthetic tests for this repository.
# Store DD_API_KEY and DD_APP_KEY as GitHub Actions secrets.
# Rotate those keys in Datadog. Do not copy them into the repository.

name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: datadog-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetics:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Datadog keys
        id: keys
        run: |
          if [ -z "$DD_API_KEY" ] || [ -z "$DD_APP_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DD_API_KEY / DD_APP_KEY secrets are not set - skipping Datadog Synthetics."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Datadog Synthetic tests
        if: steps.keys.outputs.present == 'true'
        uses: DataDog/synthetics-ci-github-action@7039855343386c30068a97ca381e68ea405e8539 # v4.1.1
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          app_key: ${{ secrets.DD_APP_KEY }}
          test_search_query: "tag:e2e-tests"
